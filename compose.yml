services:
  oracle-db-a1016:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-db-a1016-container
    ports:
      - "1521:1521"
    environment:
      # - ORACLE_SID=ORCL
      # - ORACLE_PDB=ORCLPDB1
      - ORACLE_PASSWORD=Kuliah123
    volumes:
      - oracle-rdbms-a1016-volumes:/opt/oracle/oradata
    networks:
      - oracle-rdbms-a1016-network
    healthcheck:
      test: ["CMD-SHELL", "sqlplus / as sysdba <<< 'SELECT 1 FROM DUAL;' || exit 1"]
      interval: 30s
      retries: 5
      timeout: 10s
    deploy:
      resources:
        reservations:
          cpus: "0.5"
          memory: 2g
        limits:
          cpus: "2"
          memory: 4g

networks:
  oracle-rdbms-a1016-network:
    driver: bridge

volumes:
  oracle-rdbms-a1016-volumes: